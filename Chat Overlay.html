<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Chat Overlay</title>
    
    <link rel="icon" href="https://socialstream.ninja/icons/favicon.ico" type="image/x-icon">
    
    <!-- Базовые скрипты и стили Social Stream Ninja -->
    <script src="https://socialstream.ninja/sources/js/objects.js"></script>
    <script src="https://socialstream.ninja/sources/js/chatHtml.js"></script>
    <script src="https://socialstream.ninja/sources/js/chatBadges.js"></script>
    <link rel="stylesheet" href="https://socialstream.ninja/sources/css/chatBadges.css">
    <script type="text/javascript" src="https://socialstream.ninja/sources/js/local-server-url.js"></script>
    <script type="text/javascript" src="https://socialstream.ninja/sources/js/transport-dedupe.js"></script>
    <script src="https://socialstream.ninja/sources/js/colours.js" type="text/javascript"></script>

    <style>
        /* Базовые параметры позиционирования контейнера */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent !important;
            overflow: hidden;
            box-sizing: border-box;
        }

        #chat-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            max-width: none;
            height: 100vh;
            overflow: hidden;
            padding: 10px 14px;
            box-sizing: border-box;
        }
        #chat-container.align-right { left: auto; right: 0; }
        #message-list-wrapper { width: 100%; transition: transform 0.35s ease-out; }
        #spacer { width: 100%; padding: 0; margin: 0; border: none; background: transparent; }

        .message.fading { opacity: 0 !important; transition: opacity 1.2s ease-out !important; }
        .message.hidden {
            opacity: 0 !important;
            transform: translateY(-16px) !important;
            max-height: 0 !important;
            margin: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            border-width: 0 !important;
        }

        /* ======================================================== */
        /* ============== КАСТОМНЫЙ СТИЛЬ ОФОРМЛЕНИЯ ============== */
        /* ======================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400;600;700;800&display=swap');

        body, html {
            background: transparent !important;
            overflow: hidden;
            font-family: "Playpen Sans", cursive, sans-serif !important;
        }

        /* Карточка сообщения */
        .message {
            display: flex !important;
            flex-direction: row !important;
            align-items: flex-start !important;
            position: relative;
            margin-top: 12px !important;
            padding: 14px 16px !important;
            width: 100% !important;
            box-sizing: border-box !important;

            border-radius: 18px !important;
            background: linear-gradient(135deg, rgba(18, 10, 30, 0.88), rgba(8, 5, 16, 0.92)) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 16px rgba(110, 45, 230, 0.35) !important;
            border: 1px solid rgba(135, 65, 255, 0.2) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: messageAppear 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        /* Аватарка */
        .message .avatar {
            display: block !important;
            width: 36px !important;
            height: 36px !important;
            min-width: 36px !important;
            border-radius: 50% !important;
            background-size: cover !important;
            background-position: center !important;
            margin-right: 12px !important;
            flex-shrink: 0 !important;
        }

        /* Правый блок */
        .message .body {
            display: flex !important;
            flex-direction: column !important;
            flex: 1 1 auto;
            min-width: 0;
        }

        /* Шапка с ником */
        .message .head {
            display: flex !important;
            align-items: center !important;
            flex-wrap: wrap;
            margin-bottom: 4px !important;
        }

        /* Никнеймы: Twitch и база — фиолетовый */
        .message .name {
            font-weight: 800 !important;
            font-size: 15px !important;
            line-height: 1.2;
            display: inline-block !important;
            margin-right: 8px !important;
            background: linear-gradient(135deg, #9146ff 0%, #ba82ff 45%, #ffffff 100%) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0 0 6px rgba(169, 112, 255, 0.8));
        }

        /* YouTube — красный */
        .message[data-source-type="youtube"] .name,
        .message[data-source-type="youtubeshorts"] .name {
            background: linear-gradient(135deg, #ff1a1a 0%, #ff4d4d 45%, #ffffff 100%) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0 0 6px rgba(255, 40, 40, 0.75));
        }

        /* TikTok — чёрно-серый градиент */
        .message[data-source-type="tiktok"] .name {
            background: linear-gradient(135deg, #3a3a3a 0%, #8a8a8a 45%, #ffffff 100%) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
        }

        /* Текст сообщения */
        .message .text {
            display: block !important;
            width: 100% !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            line-height: 1.4 !important;
            color: #ffbe7a !important;
            text-shadow: 0 0 10px rgba(255, 160, 95, 0.25) !important;
            word-break: break-word !important;
        }

        .message .badge, .message .source-icon {
            display: inline-block !important;
            vertical-align: middle;
            max-height: 16px !important;
            margin-right: 4px;
        }

        .message .text img {
            vertical-align: middle;
            max-height: 28px;
        }

        @keyframes messageAppear {
            0%   { opacity: 0; transform: translateY(12px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
<div id="chat-container">
    <div id="message-list-wrapper">
        <div id="spacer" style="height: 2200px; width: 100%;"></div>
    </div>
</div>

<script>
    var urlParams = new URLSearchParams(window.location.search);
    var SERVER_EXCLUSIVE_TRANSPORT_VERSION = "3.52.0";
    var TRANSPORT_CAPABILITIES = {
        serverFeed: true,
        serverTargeted: false,
        upstreamCommands: false,
        customChannel: false,
        legacyBridgeRequired: false,
        exclusiveServerParams: { server: false, server2: true, server3: false }
    };

    function versionAtLeast(value, minimum) {
        var a = String(value || "").split(".");
        var b = String(minimum || "").split(".");
        var len = Math.max(a.length, b.length);
        for (var i = 0; i < len; i++) {
            var av = parseInt(a[i], 10) || 0;
            var bv = parseInt(b[i], 10) || 0;
            if (av > bv) return true;
            if (av < bv) return false;
        }
        return true;
    }

    function hasExclusiveServerTransport(caps) {
        var params = caps && typeof caps.exclusiveServerParams === "object" ? caps.exclusiveServerParams : { server2: true };
        return (params.server === true && urlParams.has("server")) ||
            (params.server2 !== false && urlParams.has("server2")) ||
            (params.server3 === true && urlParams.has("server2") && urlParams.has("server3"));
    }

    function useServerOnlyTransport() {
        var caps = (typeof TRANSPORT_CAPABILITIES === "object" && TRANSPORT_CAPABILITIES) ? TRANSPORT_CAPABILITIES : {};
        return hasExclusiveServerTransport(caps) &&
            versionAtLeast(urlParams.get("v"), SERVER_EXCLUSIVE_TRANSPORT_VERSION) &&
            caps.serverFeed === true &&
            caps.legacyBridgeRequired !== true &&
            caps.upstreamCommands !== true &&
            caps.customChannel !== true;
    }

    // Если session не указан в URL, по умолчанию используется ваш текущий session ID: yzSPKxMkmF
    var roomID = urlParams.has("session") ? urlParams.get("session") : "yzSPKxMkmF";
    var password = urlParams.has("password") ? urlParams.get("password") : "false";
    var featuredMode = false;
    var reversed = urlParams.has("reverse");
    var deleteOnlyLast = urlParams.has("deleteonlylast");
    var hideAvatar = urlParams.has("noavatar");
    var hideBadges = urlParams.has("nobadges");
    var stripMemberships = urlParams.has("stripmemberships");
    var hideIcon = urlParams.has("noicon");
    var showClock = urlParams.has("time");
    var hideBots = urlParams.has("hidebots");

    const chatContainer = document.getElementById('chat-container');
    const messageListWrapper = document.getElementById('message-list-wrapper');
    const topSpacer = document.getElementById('spacer');
    const initialSpacerHeight = topSpacer.style.height || '2200px';

    if (urlParams.has("width")) {
        var w = parseInt(urlParams.get("width"), 10);
        if (!isNaN(w) && w > 0) { chatContainer.style.maxWidth = w + "px"; }
    }
    if ((urlParams.get("align") || "").toLowerCase() === "right") {
        chatContainer.classList.add("align-right");
    }

    const MAX_MESSAGES = urlParams.has("limit") ? parseInt(urlParams.get("limit")) : 40;
    const showtime = urlParams.has("showtime") ? parseInt(urlParams.get("showtime")) : 0;
    var overlayMessageCounter = 0;
    var localBlockUserList = {};
    var timedOutUsers = {};
    const messageTimestamps = new Map();
    const MAX_SPACER_HEIGHT_BEFORE_RESET = 18000000;

    if (reversed) {
        topSpacer.style.display = 'none';
        chatContainer.style.bottom = 'auto';
        chatContainer.style.top = '0';
        chatContainer.classList.add('reverse-mode');
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function fallbackEscapeHtml(str) {
        return escapeHtml(str);
    }
    function escapeCssUrlAttribute(str) {
        return String(str).replace(/['"\\]/g, "");
    }
    function nowClock() {
        var d = new Date();
        var h = d.getHours();
        var m = d.getMinutes();
        return (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m);
    }

    function adjustMessageWrapperScroll() {
        if (reversed) return;
        requestAnimationFrame(function () {
            const wrapperScrollHeight = messageListWrapper.scrollHeight;
            const containerClientHeight = chatContainer.clientHeight;
            let translateY = 0;
            if (wrapperScrollHeight > containerClientHeight) {
                translateY = -(wrapperScrollHeight - containerClientHeight);
            }
            translateY = Math.min(0, translateY);
            messageListWrapper.style.transform = 'translateY(' + translateY + 'px)';
        });
    }

    function getOverlayMessages() {
        return Array.from(messageListWrapper.children).filter(function (child) {
            return child.id !== 'spacer' && child.classList.contains('message');
        });
    }

    function getPayloadMessageId(data) {
        var keys = ['mid', 'id', 'messageId', 'message_id'];
        for (var i = 0; i < keys.length; i++) {
            if (data[keys[i]] !== undefined && data[keys[i]] !== null && data[keys[i]] !== "") {
                return String(data[keys[i]]);
            }
        }
        if (data.meta) {
            if (data.meta.messageId) { return String(data.meta.messageId); }
            if (data.meta.message_id) { return String(data.meta.message_id); }
        }
        overlayMessageCounter += 1;
        return 'msg-' + Date.now() + '-' + overlayMessageCounter;
    }

    function removeOverlayMessage(message) {
        if (!message) { return; }
        messageTimestamps.delete(message.id);
        if (message.parentNode) { message.parentNode.removeChild(message); }
    }

    function getNewestMessage(messages) {
        return messages.reduce(function (newest, message) {
            return (messageTimestamps.get(newest.id) || 0) > (messageTimestamps.get(message.id) || 0) ? newest : message;
        });
    }

    function removeMatchingMessages(matches, onlyLast) {
        const messages = getOverlayMessages().filter(matches);
        if (!messages.length) { return false; }
        if (onlyLast) { removeOverlayMessage(getNewestMessage(messages)); }
        else { messages.forEach(removeOverlayMessage); }
        adjustMessageWrapperScroll();
        return true;
    }

    function deleteMessageById(id) {
        if (id === undefined || id === null || id === "") { return false; }
        const idString = String(id);
        return removeMatchingMessages(function (message) {
            return message.dataset.mid === idString || message.id === idString;
        }, true);
    }

    function deleteMessages(data, onlyLast) {
        if (!data.delete || typeof data.delete !== "object") { return false; }
        const d = data.delete;
        return removeMatchingMessages(function (message) {
            if (d.id !== undefined && d.id !== null && d.id !== "") {
                const idString = String(d.id);
                return message.dataset.mid === idString || message.id === idString;
            }
            if (d.chatname && message.dataset.chatname !== String(d.chatname)) { return false; }
            if (d.type && message.dataset.sourceType !== String(d.type)) { return false; }
            return !!(d.chatname || d.type);
        }, onlyLast || d.onlyLast);
    }

    function removeUserMessages(username, type) {
        if (!username) { return false; }
        username = String(username);
        type = type ? String(type) : "";
        return removeMatchingMessages(function (message) {
            if (message.dataset.chatname !== username) { return false; }
            if (!type) { return true; }
            return message.dataset.sourceType === type || (type === "youtube" && message.dataset.sourceType === "youtubeshorts");
        }, false);
    }

    function addLocalBlock(username, type) {
        if (!username) { return; }
        username = String(username);
        const types = type ? [String(type)] : ["*"];
        if (type === "youtube") { types.push("youtubeshorts"); }
        if (!localBlockUserList[username]) { localBlockUserList[username] = []; }
        types.forEach(function (t) {
            if (!localBlockUserList[username].includes(t)) { localBlockUserList[username].push(t); }
        });
        setTimeout(function () {
            if (!localBlockUserList[username]) { return; }
            types.forEach(function (t) {
                const idx = localBlockUserList[username].indexOf(t);
                if (idx !== -1) { localBlockUserList[username].splice(idx, 1); }
            });
            if (!localBlockUserList[username].length) { delete localBlockUserList[username]; }
        }, 10000);
    }

    function isMessageBlocked(data) {
        if (hideBots && data.bot) { return true; }
        if (!data.chatname) { return false; }
        const chatname = String(data.chatname);
        const type = data.type ? String(data.type) : "";
        if (localBlockUserList[chatname] && (localBlockUserList[chatname].includes(type) || localBlockUserList[chatname].includes("*"))) {
            return true;
        }
        if (type && timedOutUsers[chatname + ":" + type]) {
            if (timedOutUsers[chatname + ":" + type] < Date.now()) { delete timedOutUsers[chatname + ":" + type]; }
            else { return true; }
        }
        return false;
    }

    function clearAllMessages() {
        getOverlayMessages().forEach(removeOverlayMessage);
        topSpacer.style.height = initialSpacerHeight;
        messageListWrapper.style.transform = '';
        adjustMessageWrapperScroll();
    }

    function handleControlPayload(data) {
        if (!data || typeof data !== "object") { return false; }
        if ("deleteMessage" in data) { deleteMessageById(data.deleteMessage); return true; }
        if ("clearAll" in data || data.action === "clear" || data.action === "clearAll") { clearAllMessages(); return true; }
        if ("delete" in data) { deleteMessages(data, deleteOnlyLast); return true; }
        if ("timeoutUser" in data && data.timeoutUser) {
            const name = data.timeoutUser.username || data.timeoutUser.chatname;
            if (name && data.timeoutUser.type && data.timeoutUser.duration) {
                timedOutUsers[String(name) + ":" + String(data.timeoutUser.type)] = Date.now() + (Number(data.timeoutUser.duration) * 1000);
            }
            removeUserMessages(name, data.timeoutUser.type);
            return true;
        }
        if ("blockUser" in data && data.blockUser) {
            const name = data.blockUser.chatname || data.blockUser.username;
            addLocalBlock(name, data.blockUser.type);
            removeUserMessages(name, data.blockUser.type);
            return true;
        }
        return false;
    }

    setInterval(function () {
        if (!(showtime > 0)) { return; }
        const now = Date.now();
        getOverlayMessages().forEach(function (message) {
            const ts = messageTimestamps.get(message.id);
            if (ts && (now - ts) > showtime && !message.classList.contains('fading')) {
                message.classList.add('fading');
                setTimeout(function () {
                    removeOverlayMessage(message);
                    adjustMessageWrapperScroll();
                }, 1200);
            }
        });
    }, 1000);

    function buildBadges(data) {
        return (hideBadges || typeof SocialStreamBadges === "undefined") ? "" : SocialStreamBadges.render(data.chatbadges);
    }

    var CROSS_TRANSPORT_DEDUPE_TTL_MS = 12000;
    var recentTransportDeliveries = new Map();
    var transportDeliveryDedupe = typeof SocialStreamTransportDedupe !== "undefined" ? SocialStreamTransportDedupe.create() : null;
    function isDuplicateTransportDelivery(data, source) {
        if (!(urlParams.has("server") || urlParams.has("server2") || urlParams.has("server3"))) {
            return false;
        }
        if (transportDeliveryDedupe) return transportDeliveryDedupe(data, source);
        if (!data || typeof data !== "object") { return false; }
        if (data.id === undefined || data.id === null) { return false; }
        if ("action" in data || "get" in data || "callback" in data || "mid" in data) { return false; }
        if (!(data.chatname || data.chatmessage || data.chatimg || data.hasDonation || data.membership || data.event || data.contentimg)) {
            return false;
        }
        var key = String(data.id) + "|" + (data.type || "") + "|" + (data.chatname || "") + "|" + String(data.chatmessage || "").slice(0, 100) + "|" + (data.hasDonation || "") + "|" + (data.event || "");
        var now = Date.now();
        recentTransportDeliveries.forEach(function (seenAt, seenKey) {
            if (now - seenAt > CROSS_TRANSPORT_DEDUPE_TTL_MS) {
                recentTransportDeliveries.delete(seenKey);
            }
        });
        if (recentTransportDeliveries.has(key)) {
            return true;
        }
        recentTransportDeliveries.set(key, now);
        return false;
    }

    function addMessageToOverlay(data, source) {
        if (isDuplicateTransportDelivery(data, source)) { return; }
        if (handleControlPayload(data)) { return; }
        if (!data || typeof data !== "object") { return; }
        if (isMessageBlocked(data)) { return; }
        if (!data.chatname && !data.chatmessage && !data.hasDonation && !data.donation && !data.contentimg) { return; }
        if (!data.chatname && data.meta && !data.chatmessage && !data.contentimg && !data.hasDonation && !data.donation) { return; }

        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        const messageId = getPayloadMessageId(data);
        messageDiv.id = messageId;
        messageDiv.dataset.mid = messageId;
        if (data.chatname) { messageDiv.dataset.chatname = data.chatname; }
        if (data.type) { messageDiv.dataset.sourceType = data.type; }
        messageTimestamps.set(messageId, Date.now());

        var sourceType = data.type ? String(data.type).replace(/[^a-zA-Z0-9_-]/g, '') : '';
        var avatarHtml = (!hideAvatar && data.chatimg)
            ? "<span class='avatar' style=\"background-image:url('" + escapeCssUrlAttribute(data.chatimg) + "')\"></span>" : "";
        var iconHtml = (!hideIcon && sourceType)
            ? "<img class='source-icon' src='https://socialstream.ninja/sources/images/" + sourceType + ".png' alt='" + sourceType + "' onerror=\"this.style.display='none'\">" : "";
        var badgesHtml = buildBadges(data);
        var clockHtml = showClock ? "<span class='timestamp'>" + nowClock() + "</span>" : "";
        var nameHtml = data.chatname
            ? "<span class='name'>" + escapeHtml(data.chatname) + "</span>" : "";
        var membershipHtml = (!stripMemberships && data.membership) ? "<div class='membership'>" + escapeHtml(data.membership) + "</div>" : "";
        var msg = data.chatmessage ? (data.textonly ? escapeHtml(data.chatmessage) : (window.SocialStreamChatHTML ? SocialStreamChatHTML.sanitize(data.chatmessage) : fallbackEscapeHtml(data.chatmessage))) : "";
        var textHtml = msg ? "<div class='text" + (data.event ? " event-text" : "") + "'>" + msg + "</div>" : "";
        var donation = data.hasDonation || data.donation || "";
        var donationHtml = donation ? "<div class='donation'>" + escapeHtml(donation) + "</div>" : "";
        var contentSrc = data.contentimg && typeof sanitizeRelayUrl === 'function' ? sanitizeRelayUrl(data.contentimg, true) : '';
        var contentImgHtml = contentSrc
            ? "<img class='content-img' src='" + fallbackEscapeHtml(contentSrc) + "' alt='' onerror=\"this.style.display='none'\">" : "";

        messageDiv.innerHTML =
            avatarHtml +
            "<div class='body'>" +
                "<div class='head'>" + nameHtml + iconHtml + badgesHtml + clockHtml + "</div>" +
                membershipHtml + textHtml + donationHtml + contentImgHtml +
            "</div>";

        if (reversed) {
            const firstMessage = messageListWrapper.querySelector('.message');
            if (firstMessage) { messageListWrapper.insertBefore(messageDiv, firstMessage); }
            else { messageListWrapper.appendChild(messageDiv); }
        } else {
            messageListWrapper.appendChild(messageDiv);
        }
        void messageDiv.offsetWidth;
        messageDiv.classList.add('visible');

        const messages = getOverlayMessages();
        if (messages.length > MAX_MESSAGES) {
            const oldestMessage = reversed ? messages[messages.length - 1] : messages[0];
            if (oldestMessage) {
                if (!reversed) {
                    const style = getComputedStyle(oldestMessage);
                    const marginBottom = parseFloat(style.marginBottom) || 0;
                    const space = oldestMessage.offsetHeight + marginBottom;
                    var newHeight = (parseFloat(topSpacer.style.height) || 0) + space;
                    if (newHeight > MAX_SPACER_HEIGHT_BEFORE_RESET) { newHeight = 0; }
                    topSpacer.style.height = newHeight + 'px';
                }
                removeOverlayMessage(oldestMessage);
            }
        }
        adjustMessageWrapperScroll();
    }

    // --- WebRTC bridge (hidden VDO.Ninja iframe) ---
    if (!useServerOnlyTransport()) {
        var iframe = document.createElement("iframe");
        if (featuredMode) {
            iframe.src = "https://vdo.socialstream.ninja/?ln&password=" + encodeURIComponent(password) + "&salt=vdo.ninja&label=overlay&exclude=" + roomID + "&scene&novideo&noaudio&cleanoutput&room=" + roomID;
        } else {
            iframe.src = "https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password=" + encodeURIComponent(password) + "&push&label=dock&vd=0&ad=0&novideo&noaudio&autostart&cleanoutput&room=" + roomID;
        }
        iframe.style.cssText = "width: 0px; height: 0px; position: fixed; left: -100px; top: -100px;";
        document.body.appendChild(iframe);
        window.addEventListener("message", function (e) {
            if (e.source != iframe.contentWindow) return;
            if (e.data && typeof e.data === "object" && e.data.dataReceived && typeof e.data.dataReceived === "object" && e.data.dataReceived.overlayNinja) {
                addMessageToOverlay(e.data.dataReceived.overlayNinja, "p2p");
            }
        });
    }

    // --- WebSocket соединение ---
    var conCon = 1;
    var socketserver = false;
    var serverURL = urlParams.has("localserver") ? SocialStreamLocalServer.getWebSocketUrl() : "wss://io.socialstream.ninja";
    function setupSocket() {
        socketserver.onclose = function () {
            setTimeout(function () { conCon += 1; socketserver = new WebSocket(serverURL); setupSocket(); }, 100 * conCon);
        };
        socketserver.onopen = function () {
            conCon = 1;
            socketserver.send(JSON.stringify({ "join": roomID, "out": 3, "in": 4 }));
        };
        socketserver.addEventListener('message', function (event) {
            if (event.data) {
                try { var data = JSON.parse(event.data); if (data) { addMessageToOverlay(data, "server"); } }
                catch (err) { console.error("Error processing WebSocket message:", err); }
            }
        });
    }
    if (urlParams.has("server") || urlParams.has("server2")) {
        serverURL = urlParams.get("server") || urlParams.get("server2") || serverURL;
